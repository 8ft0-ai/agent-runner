name: Engineering fixture integrity
on:
  pull_request:
    paths:
      - 'tasks/engineering/**'
      - 'scripts/hosted-screen.py'
      - 'scripts/hosted-nemotron.py'
      - '.github/workflows/hosted-nemotron.yml'
      - '.github/workflows/engineering-fixtures.yml'
      - 'tests/test_engineering_pack.py'
      - 'tests/test_lightning_route.py'
      - 'tests/test_provider_relay.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify frozen task snapshots and no-op controls
        run: python3 -m unittest discover -s tests -p test_engineering_pack.py -v
      - name: Verify fixed model-route admission without inference
        run: python3 -m unittest discover -s tests -p test_lightning_route.py -v
      - name: Verify bounded relay backoff and budget stop without inference
        run: python3 -m unittest discover -s tests -p test_provider_relay.py -v
