name: Hosted Nemotron pilot
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Inference provider
        type: choice
        required: true
        default: NVIDIA
        options:
          - NVIDIA
          - OpenRouter
permissions:
  contents: read
concurrency:
  group: hosted-nemotron-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned OpenCode
        run: |
          mkdir -p "$RUNNER_TEMP/cli" "$RUNNER_TEMP/evidence"
          cd "$RUNNER_TEMP/cli"
          curl -fsSL https://github.com/anomalyco/opencode/releases/download/v2.4.2/opencode-linux-x64.tar.gz -o cli.tgz
          echo '452912288f934d1771bd5bd0d8611ba3a6adc3db3ac3333c37facf373770ba66  cli.tgz' | sha256sum -c -
          tar xzf cli.tgz opencode
          test "$(./opencode --version)" = 'opencode v2.4.2'
      - name: Run isolated task and check result
        env:
          PILOT_PROVIDER: ${{ inputs.provider }}
          PILOT_API_KEY: ${{ secrets[inputs.provider == 'OpenRouter' && 'OPENROUTER_API_KEY' || 'NVIDIA_API_KEY'] }}
        run: python3 scripts/hosted-nemotron.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nemotron-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          retention-days: 5
          if-no-files-found: error
