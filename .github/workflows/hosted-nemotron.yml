name: Hosted Nemotron pilot
on:
  workflow_dispatch:
    inputs:
      task:
        description: Synthetic benchmark fixture
        type: choice
        required: true
        default: feature.minimal_report_format_001
        options:
          - feature.minimal_report_format_001
          - root_cause.relay_request_correlation_001
      screen_agent:
        description: Optional read–edit–test compatibility screen
        type: choice
        default: none
        options: [none, qwen, goose, pi, aider]
      screen_phase:
        description: Run the compatibility probe or score the frozen relay task
        type: choice
        default: probe
        options: [probe, score]
      provider:
        description: Inference provider
        type: choice
        required: true
        default: NVIDIA
        options:
          - NVIDIA
          - OpenRouter
permissions:
  contents: read
concurrency:
  group: hosted-nemotron-pilot
  cancel-in-progress: false
jobs:
  pilot:
    if: inputs.screen_agent == 'none' || inputs.screen_agent == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned OpenCode
        run: |
          mkdir -p "$RUNNER_TEMP/cli" "$RUNNER_TEMP/evidence"
          cd "$RUNNER_TEMP/cli"
          curl -fsSL https://github.com/anomalyco/opencode/releases/download/v2.4.2/opencode-linux-x64.tar.gz -o cli.tgz
          echo '452912288f934d1771bd5bd0d8611ba3a6adc3db3ac3333c37facf373770ba66  cli.tgz' | sha256sum -c -
          tar xzf cli.tgz opencode
          test "$(./opencode --version)" = 'opencode v2.4.2'
      - name: Run isolated task and check result
        env:
          PILOT_TASK: ${{ inputs.task }}
          PILOT_PROVIDER: ${{ inputs.provider }}
          PILOT_API_KEY: ${{ secrets[inputs.provider == 'OpenRouter' && 'OPENROUTER_API_KEY' || 'NVIDIA_API_KEY'] }}
        run: python3 scripts/hosted-nemotron.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nemotron-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          retention-days: 5
          if-no-files-found: error
  screen:
    if: inputs.screen_agent != 'none' && inputs.screen_agent != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        if: inputs.screen_agent == 'qwen' || inputs.screen_agent == 'pi'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned screening candidate
        env:
          SCREEN_AGENT: ${{ inputs.screen_agent }}
        run: bash scripts/install-screen-cli.sh
      - name: Run isolated agent and verify candidate
        env:
          SCREEN_AGENT: ${{ inputs.screen_agent }}
          SCREEN_PHASE: ${{ inputs.screen_phase }}
          PILOT_PROVIDER: ${{ inputs.provider }}
          PILOT_API_KEY: ${{ secrets[inputs.provider == 'OpenRouter' && 'OPENROUTER_API_KEY' || 'NVIDIA_API_KEY'] }}
        run: python3 scripts/hosted-screen.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: screen-${{ inputs.screen_agent }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          retention-days: 5
          if-no-files-found: warn
